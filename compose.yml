services:
  banco-teste:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymhub_test
      POSTGRES_USER: gymhub_test
      POSTGRES_PASSWORD: gymhub_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymhub_test -d gymhub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymhub
      POSTGRES_USER: ${DB_USER:-gymhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gymhub}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gymhub"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dados-postgres:
