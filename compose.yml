services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymhub
      POSTGRES_USER: ${DB_USER:-gymhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gymhub}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gymhub"]
      interval: 2s
      timeout: 3s
      retries: 30
  aplicacao:
    build: .
    environment:
      DB_URL: jdbc:postgresql://banco:5432/gymhub
      DB_USER: ${DB_USER:-gymhub}
      DB_PASSWORD: ${DB_PASSWORD:-gymhub}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  dados-postgres:
