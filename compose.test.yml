services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymhub_test
      POSTGRES_USER: gymhub_test
      POSTGRES_PASSWORD: gymhub_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymhub_test -d gymhub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
